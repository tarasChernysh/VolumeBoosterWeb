<!DOCTYPE html>
<!-- 1200×630 default share image: ?title=&sub=&pills=a|b|c&lang=&dir= (English when empty). Rendered per language by src/og/render.mjs. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Outfit', -apple-system, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    color: #F0FDF4;
    background:
      radial-gradient(circle at 78% 40%, rgba(0, 255, 102, 0.28), transparent 45%),
      radial-gradient(circle at 10% 100%, rgba(0, 212, 255, 0.12), transparent 40%),
      #0A1A0A;
    display: flex; align-items: center; padding: 0 72px; gap: 48px;
  }
  :lang(ar) body { font-family: 'Outfit', -apple-system, 'SF Arabic', 'Geeza Pro', sans-serif; }
  :lang(ar) h1 { letter-spacing: 0; line-height: 1.3; }
  :lang(ja) body { font-family: 'Outfit', -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif; }
  .text { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .brand img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 0 40px rgba(0, 255, 102, 0.35); }
  .brand span { font-size: 34px; font-weight: 600; color: #86EFAC; }
  h1 { font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 24px; }
  h1 em { font-style: normal; color: #00FF66; white-space: nowrap; } /* keep the highlighted words together (もっと大きく, أعلى صوتًا) */
  p { font-size: 28px; color: #86EFAC; margin-bottom: 36px; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; }
  .pills span { font-size: 22px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
    border: 1.5px solid rgba(0, 255, 102, 0.35); background: rgba(0, 255, 102, 0.08); }
  .phone { flex-shrink: 0; }
  .phone img { display: block; width: 350px; height: 510px; border-radius: 28px;
    border: 2px solid rgba(240, 253, 244, 0.16); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(0, 255, 102, 0.2); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../assets/images/app-icon.png" alt=""><span>EQfy - Louder Volume</span></div>
    <h1 id="title">Make your iPhone <em>louder</em></h1>
    <p id="sub">Volume &amp; bass booster with a pro equalizer</p>
    <div class="pills" id="pills"><span>Up to 200% volume</span><span>7-band EQ</span><span>3D Audio</span><span>AI Studio</span></div>
  </div>
  <div class="phone"><img src="../../assets/images/blog/iphone-duo/05-volume-booster.webp" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.documentElement.lang = q.get('lang') || 'en';
    document.documentElement.dir = q.get('dir') || 'ltr';
    const h1 = document.getElementById('title');
    if (q.get('title')) h1.innerHTML = q.get('title'); // our own i18n text; may contain <em>
    if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
    if (q.get('pills')) document.getElementById('pills').replaceChildren(...q.get('pills').split('|').map((t) => Object.assign(document.createElement('span'), { textContent: t })));
    // Once the font is in, shrink a long title until the text column fits the image.
    document.fonts.ready.then(() => {
      const text = document.querySelector('.text');
      for (let size = 72; size > 44 && text.offsetHeight > 560; size -= 2) h1.style.fontSize = size - 2 + 'px';
    });
  </script>
</body>
</html>
