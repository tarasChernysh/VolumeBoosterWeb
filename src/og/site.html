<!DOCTYPE html>
<!-- 1200×630 share image. Render: see README "Regenerating share images". -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Outfit', -apple-system, 'Helvetica Neue', sans-serif;
    color: #F0FDF4;
    background:
      radial-gradient(circle at 78% 40%, rgba(0, 255, 102, 0.28), transparent 45%),
      radial-gradient(circle at 10% 100%, rgba(0, 212, 255, 0.12), transparent 40%),
      #0A1A0A;
    display: flex; align-items: center; padding: 0 72px; gap: 48px;
  }
  .text { flex: 1; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
  .brand img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 0 40px rgba(0, 255, 102, 0.35); }
  .brand span { font-size: 34px; font-weight: 600; color: #86EFAC; }
  h1 { font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 24px; }
  h1 em { font-style: normal; color: #00FF66; }
  p { font-size: 28px; color: #86EFAC; margin-bottom: 36px; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; }
  .pills span { font-size: 22px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
    border: 1.5px solid rgba(0, 255, 102, 0.35); background: rgba(0, 255, 102, 0.08); }
  .phone { flex-shrink: 0; }
  .phone img { display: block; width: 350px; height: 510px; border-radius: 28px;
    border: 2px solid rgba(240, 253, 244, 0.16); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(0, 255, 102, 0.2); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../assets/images/app-icon.png" alt=""><span>EQfy - Louder Volume</span></div>
    <h1>Make your iPhone <em>louder</em></h1>
    <p>Volume &amp; bass booster with a pro equalizer</p>
    <div class="pills"><span>Up to 200% volume</span><span>7-band EQ</span><span>3D Audio</span><span>AI Studio</span></div>
  </div>
  <div class="phone"><img src="../../assets/images/blog/iphone-duo/05-volume-booster.webp" alt=""></div>
</body>
</html>
